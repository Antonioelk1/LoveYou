<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none" />
  <title>I Love You Forever</title>
  <style>
    /* --- Base page --- */
    body {
      background: #000;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- حاوية الـ SVG المتجاوبة (Container) --- */
    #heart-container {
      width: 90vw; /* واخد 90% من عرض الشاشة */
      max-width: 500px; /* باش ما يكبرش بزاف فالايباد/الحاسوب */
      height: auto;
      /* المنظور لـ 3D لـ تأثير العمق */
      perspective: 1000px;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      /* باش نحافظوا على أبعاد 3D */
      transform-style: preserve-3d;
      /* أنيماسيون لقلب كامل كيدور ببطء فـ 3D */
      animation: heartRotate 30s infinite linear;
    }

    /* --- الحب - تنسيق الكتابة --- */
    .love_text {
      font-size: 1.2rem; /* حجم الخط مناسب ومقروء */
      fill: #ea80b0; /* لون الكتابة (استخدمت fill حيت وسط SVG) */
      text-shadow: 0 0 8px #ffb6c1;
      letter-spacing: 1px;
      dominant-baseline: middle; /* تمركز الكتابة عمودياً */
      text-anchor: middle;      /* تمركز الكتابة أفقياً */
      font-weight: bold;
    }

    /* --- أنيماسيون الدوران ببطء في 3D للقلب كامل --- */
    @keyframes heartRotate {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      50%  { transform: rotateY(180deg) rotateX(5deg); }
      100% { transform: rotateY(360deg) rotateX(0deg); }
    }
  </style>
</head>
<body>

  <div id="heart-container">
    <svg viewBox="0 0 500 400">
      <path id="heart-path" d="M250,90 C150,0 0,90 0,180 C0,300 150,350 250,400 C350,350 500,300 500,180 C500,90 350,0 250,90 Z" 
            fill="none" 
            stroke="none" />
      </svg>
  </div>

  <script>
    const N = 80; // عدد كلمات I love you فـ لقلب
    const svgNamespace = "http://www.w3.org/2000/svg";
    const path = document.getElementById("heart-path");
    const container = document.querySelector("#heart-container svg");

    // حساب طول المسار لقلب
    const totalLength = path.getTotalLength();

    for (let i = 0; i < N; i++) {
      // حساب الموقع ديال كل كلمة على طول المسار
      const distance = (totalLength / N) * i;
      const point = path.getPointAtLength(distance);

      // إنشاء عنصر Text فـ SVG
      const textNode = document.createElementNS(svgNamespace, "text");
      textNode.className = 'love_text';
      textNode.textContent = 'I love you';

      // وضع الكتابة فالمركز الصحيح على المسار
      textNode.setAttribute("x", point.x);
      textNode.setAttribute("y", point.y);

      container.appendChild(textNode);
    }
  </script>
</body>
</html>
