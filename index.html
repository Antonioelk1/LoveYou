<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Love Forever</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* --- Base page --- */
    body {
      background: #000;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      /* المنظور لـ 3D */
      perspective: 1000px; 
    }

    /* --- Container (متجاوب) --- */
    #ui {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* --- Love words (متجاوب) --- */
    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      /* استخدام نسبة مئوية للحجم باش يكون متجاوب */
      width: 80%; /* القلب غياخد 80% من عرض الشاشة كحد أقصى */
      max-width: 450px; /* باش ما يكبرش بزاف فـ الشاشات الكبيرة */
      height: auto;
      transform: translate(-50%, -50%); 
      transform-style: preserve-3d;
    }

    #ui .love_word {
      color: #ea80b0;
      font-size: 1.1rem; /* حجم الخط مناسب للهواتف */
      text-shadow: 0 0 8px #ffb6c1;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* --- الأنيماسيون مع الحفاظ على 3D --- */
    #ui .love_horizontal {
      transform-style: preserve-3d;
      animation: horizontal 10000ms infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }

    #ui .love_vertical {
      transform-style: preserve-3d;
      animation: vertical 20000ms infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    /* --- Animations (متجاوبة) --- */
    @keyframes horizontal {
      from { transform: translateX(-40%); } /* الحركة نسبة مئوية لعرض العنصر */
      to   { transform: translateX(40%); }  
    }

    @keyframes vertical {
      0%   { transform: translateY(10%) rotateY(0deg); } /* الحركة نسبة مئوية لارتفاع العنصر */
      /* باقي الـ keyframes غيكونو بنفس النسبة المئوية على حسب الارتفاع الجديد للقلب */
      100% { transform: translateY(10%) rotateY(360deg); }
    }
  </style>
</head>
<body>

  <div id="ui"></div>

  <script>
    const N = 80; // عدد الكلمات
    const ui = document.getElementById('ui');

    for (let i = 1; i <= N; i++) {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--i', i);

      const h = document.createElement('div');
      h.className = 'love_horizontal';

      const v = document.createElement('div');
      v.className = 'love_vertical';

      const word = document.createElement('div');
      word.className = 'love_word';
      word.textContent = 'I love you';

      v.appendChild(word);
      h.appendChild(v);
      love.appendChild(h);
      ui.appendChild(love);
    }
  </script>
</body>
</html>
